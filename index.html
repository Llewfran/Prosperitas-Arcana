html{padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: one narrow column, phone first, dark card-table look. Gold-edged number discs and Raw gem colours come from the card art. */
:root{
  --bg:#0d0a14; --panel:#1a1424; --panel2:#241b31; --ink:#f3ecdc; --mute:#a99fbd; --line:#3a2f4d;
  --gold:#d8a234; --gold-ink:#241705; --cream:#fff7de; --bad:#ff8f87; --good:#7fdc9f; --warn:#f2b45a; --bad-bg:#3a1c22; --good-bg:#17301f;
  --font-d:'Caladea','Cambria',Georgia,serif; --font-b:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:radial-gradient(1200px 500px at 50% -120px,#2c1f44 0,#0d0a14 60%) no-repeat,var(--bg);background-color:var(--bg);color:var(--ink);font:15px/1.45 var(--font-b);margin:0;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--font-d);margin:0;font-weight:700;text-wrap:balance;letter-spacing:.02em}
h2{font-size:1.2rem;color:var(--cream)} h3{font-size:.95rem;color:var(--cream)}
#app{max-width:660px;margin:0 auto;padding-bottom:56px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 82%,transparent);padding:10px 0 12px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.brand{font:700 .7rem var(--font-d);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.disc{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#4a3560,#241830);border:2px solid var(--gold);box-shadow:0 0 0 2px #0d0a14,0 0 0 3px #6e5120;font:900 1.25rem var(--font-b);color:var(--cream);flex:none}
.sub{font-size:.8rem;color:var(--mute)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .grow{flex:1;min-width:0}
.mute{color:var(--mute)} .small{font-size:.85rem}
button{font:600 .92rem var(--font-b);border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:10px 14px;min-height:44px;cursor:pointer}
button.pri{background:linear-gradient(#e8b843,#c48d22);color:var(--gold-ink);border-color:#f0cf7a}
button.bad{color:var(--bad)} button:disabled{opacity:.4;cursor:not-allowed}
button.sm{min-height:36px;padding:6px 11px;font-size:.83rem}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
input,select{font:inherit;color:var(--ink);background:#120d1b;border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;max-width:100%}
input[type=number]{width:84px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.83rem}
.crest{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 50% 30%,#3a2a52,#1c1428);display:grid;place-items:center;box-shadow:0 0 0 2px #0d0a14,0 0 0 3px #6e5120}
.crest svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seat{display:flex;gap:12px;align-items:center}
.nm{font:700 1rem var(--font-d);color:var(--cream)}
.house{color:var(--gold);font-weight:600}
.badge{font-size:.76rem;font-weight:700;border-radius:6px;padding:3px 8px;background:var(--panel2)}
.badge.lock{background:var(--good-bg);color:var(--good)} .badge.err{background:var(--bad-bg);color:var(--bad)}
.gem{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,var(--l),var(--m) 55%,var(--d));box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.gem.lg{width:22px;height:22px}
.recipe{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.act{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;display:grid;gap:8px;background:var(--panel2)}
.act.bad{border-color:var(--bad);background:var(--bad-bg)}
.msg{font-size:.85rem;color:var(--bad)} .ok{color:var(--good);font-size:.85rem} .warnbox{background:#3a2a10;border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:.88rem;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tile{display:grid;gap:4px;justify-items:center;text-align:center;padding:6px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:.78rem;min-height:0;color:var(--ink)}
.tile img{width:100%;max-width:92px;aspect-ratio:2/3;object-fit:cover;border-radius:6px;display:block}
.tile.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.tile.z{opacity:.45}
.tile b{font-variant-numeric:tabular-nums}
.raws{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rawtile{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:.85rem}
.rawtile.z{opacity:.5} .rawtile b{margin-left:auto;font-variant-numeric:tabular-nums;font-size:1rem}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin-top:8px}
.mat{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:.82rem}
.mat img{width:24px;height:36px;object-fit:cover;border-radius:3px}
.mat b{margin-left:auto;font-variant-numeric:tabular-nums} .mat.z{opacity:.5}
.blank{min-height:52vh;display:grid;place-items:center;text-align:center;gap:14px;padding:24px 0;justify-items:center}
.blank .crest{width:84px;height:84px}.blank .crest svg{width:48px;height:48px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tabs button.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
textarea{width:100%;min-height:160px;font:12px/1.4 ui-monospace,monospace;background:#120d1b;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.sum{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.sum li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold);border-radius:4px;padding:1px 6px}
.tag.auto{background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.rec{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rec img{width:64px;aspect-ratio:2/3;object-fit:cover;border-radius:6px}
.moth{font-size:.84rem;color:var(--mute);font-style:italic}
.cols{display:block}
html{-webkit-text-size-adjust:100%} button,.tile,.rawtile{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (min-width:820px){
  body{font-size:17px}
  #app{max-width:1120px}
  .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px;align-items:start}
  .cols>.panel{margin-top:14px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
  button{min-height:48px;font-size:1rem} button.sm{min-height:42px}
  input,select{min-height:48px}
  .disc{width:54px;height:54px;font-size:1.5rem}
  .mats{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
}
@media (min-width:1180px){.cols{grid-template-columns:repeat(3,minmax(0,1fr))}}

</style>

const enc=o=>{const b=new TextEncoder().encode(JSON.stringify(o));let t='';b.forEach(x=>t+=String.fromCharCode(x));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const dec=c=>{try{c=String(c).replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');while(c.length%4)c+='=';const t=atob(c);const b=Uint8Array.from(t,x=>x.charCodeAt(0));return JSON.parse(new TextDecoder().decode(b))}catch(e){return null}};
const codeOf=s=>{s=String(s||'').trim();const m=s.match(/(?:seat|order)=([A-Za-z0-9_\-\s]+)/);return m?m[1]:s};
function loadSeat(){try{const t=localStorage.getItem(KEY2);if(t){const g=JSON.parse(t);if(g&&g.seat)return g}}catch(e){}return null}
function joinSeat(code){

const maxv=n=>{const g=GOODS[n];const m=S.mover&&MOVERS[S.mover];return g.max+(m?m.f(g,n):0)};

/* ---------- stock projection for the pickers ---------- */
function projectFree(i,skip){
  const p=S.players[i],o=ord(i),free={...p.hold};
  const acts=o.acts.map((a,k)=>[a,k]).filter(([a,k])=>k!==skip&&k<6&&a.target&&a.n>=1);
  acts.filter(([a])=>a.type==='bid').forEach(([a])=>{if(S.market.includes(a.target)&&GOODS[a.target].c.every(c=>free[c]>=1))GOODS[a.target].c.forEach(c=>free[c]--)});
  acts.filter(([a])=>a.type==='process').forEach(([a])=>{const need={};RECIPE[a.target].forEach(r=>need[r]=(need[r]||0)+a.n);
    if(Object.keys(need).every(r=>free[r]>=need[r])){Object.keys(need).forEach(r=>free[r]-=need[r]);free[a.target]+=a.n}});
  acts.filter(([a])=>a.type==='sell').forEach(([a])=>{if(free[a.target]>=a.n)free[a.target]-=a.n});
  return free;
}
const canMakeN=(m,free)=>Math.min(...[...new Set(RECIPE[m])].map(r=>Math.floor(free[r]/RECIPE[m].filter(x=>x===r).length)));

/* ---------- validation, in resolution order ---------- */
function validate(i){
  const p=S.players[i],o=ord(i),res=o.acts.map(()=>null);
  const free={...p.hold}; const seen=new Set();
  o.acts.forEach((a,k)=>{if(k>=6)res[k]='Only six actions are allowed in a Year.'});
  const each=(t,fn)=>o.acts.forEach((a,k)=>{if(a.type===t&&!res[k])fn(a,k)});
  each('bid',(a,k)=>{
    if(!a.target||!S.market.includes(a.target)){res[k]='Choose a contract in the Demand Market.';return}
    if(seen.has(a.target)){res[k]='One bid per contract.';return}
    const mx=maxv(a.target);
    if(!(a.n>=1)){res[k]='Enter a bid of 1 or more.';return}
    if(a.n>mx){res[k]='Over this Year\'s Max of '+mx+'.';return}
    const miss=GOODS[a.target].c.filter(c=>free[c]<1);
    if(miss.length){
      const canMake=miss.filter(c=>RECIPE[c].every(r=>p.hold[r]>=RECIPE[c].filter(x=>x===r).length));
      res[k]='Not accepted: you do not hold '+miss.join(' and ')+'. Contracts resolve before Process, so cards you make this Year cannot be used.'+(canMake.length?' You could Process '+canMake.join(' and ')+' now and bid next Year.':' You also lack the Raw to make '+(miss.length>1?'them':'it')+'.');return}
    GOODS[a.target].c.forEach(c=>free[c]--);seen.add(a.target);
  });
  each('process',(a,k)=>{
    if(!a.target){res[k]='Choose a material.';return}
    if(!(a.n>=1)){res[k]='Enter a quantity.';return}
    const need={};RECIPE[a.target].forEach(r=>need[r]=(need[r]||0)+a.n);
    const miss=Object.keys(need).filter(r=>free[r]<need[r]);
    if(miss.length){res[k]='Not enough Raw: '+miss.map(r=>r+' ('+free[r]+' of '+need[r]+')').join(', ')+'.';return}
    Object.keys(need).forEach(r=>free[r]-=need[r]);free[a.target]+=a.n;
  });
  each('sell',(a,k)=>{
    if(!a.target){res[k]='Choose a material.';return}
    if(!(a.n>=1)){res[k]='Enter a quantity.';return}
    if(free[a.target]<a.n){res[k]='You would hold only '+free[a.target]+' '+a.target+' at that point.';return}
    free[a.target]-=a.n;
  });
  each('buy',(a,k)=>{if(!a.target)res[k]='Choose a material.';else if(!(a.n>=1))res[k]='Enter a quantity.'});
  each('raw',(a,k)=>{if(!a.target)res[k]='Choose a Raw Material.';else if(!(a.n>=1))res[k]='Enter a quantity.'});
  return res;
}

const STG=['Contracts','Process','Trade Sell','Trade Buy','Raw Buy'];
const fm=n=>(n>0?'+':n<0?'\u2212':'')+Math.abs(n);
function flows(){
  const F={},mania=S.mover==='Speculative Mania';
  alive().forEach(i=>{F[i]={lines:[[],[],[],[],[]],net:[0,0,0,0,0],missing:new Set()}});
  alive().forEach(i=>{
    const p=S.players[i],o=ord(i),f=F[i],R=S.results[i]||[],types=new Set();
    const add=(st,t,v)=>{f.lines[st].push([t,v]);f.net[st]+=v};
    o.acts.forEach((a,k)=>{const r=R[k]||{};
      if(a.type==='bid'){if(r.won)add(0,'Won '+a.target+', value paid',Number(r.v)||0)}
      else if(a.type==='process')types.add(a.target);
      else if(a.type==='sell'){const px=S.prices.sell[a.target];
        if(!(px>0)){f.missing.add(2);return}
        add(2,'Sold '+a.n+' '+a.target+' at '+px+(mania?' (+1 Mania)':''),a.n*(px+(mania?1:0)));
        if(p.house==='Aurivane')add(2,'House Aurivane bonus',1)}
      else if(a.type==='buy'){const u=r.q;if(!(u>0))return;const px=S.prices.buy[a.target];
        if(!(px>0)){f.missing.add(3);return}
        add(3,'Bought '+u+' '+a.target+' at '+px,-u*px);
        if(p.house==='Astravan')add(3,'House Astravan discount',Math.min(1,u*px))}
      else if(a.type==='raw'){const u=r.q;if(!(u>0))return;const px=S.prices.raw[a.target];
        if(!(px>0)){f.missing.add(4);return}
        add(4,'Raw Buy '+u+' '+a.target+' at '+px,-u*px)}
    });
    if(p.house==='Caelorum'&&types.size)add(1,'House Caelorum bonus: '+types.size+' type'+(types.size>1?'s':'')+' processed',types.size);
    f.start=p.gold;let b=p.gold;f.bal=[];f.net.forEach(n=>{b+=n;f.bal.push(b)});f.end=b;
  });
  return F;
}
function stageNeeds(st){
  const need={};
  alive().forEach(i=>ord(i).acts.forEach((a,k)=>{const r=(S.results[i]||[])[k]||{};
    if(st===2&&a.type==='sell')need[a.target]=1;
    if(st===3&&a.type==='buy'&&r.q>0)need[a.target]=1;
    if(st===4&&a.type==='raw'&&r.q>0)need[a.target]=1;}));
  return Object.keys(need);
}

      else if(a.type==='process')h+='<div class="act"><div>Process <b>'+a.n+' '+esc(a.target)+'</b> '+recipeHtml(a.target,false)+' <span class="tag auto">Automatic</span></div></div>';

      else h+='<div class="act"><div>'+TICON[a.type]+' of <b>'+a.n+' '+esc(a.target)+'</b></div><label class="row small">Units actually received <input type="number" min="0" max="'+a.n+'" data-c="rq" data-i="'+i+'" data-k="'+k+'" value="'+r.q+'"></label></div>';});

    }
    if(f.missing.has(st)){h+='<div class="warnbox">Enter the price above to see this House\'s Gold.</div>';blocked=true}
    if(after<0){blocked=true;const sf=-after;
      h+='<div class="warnbox" style="border-color:var(--bad);color:var(--bad);background:var(--bad-bg)" role="alert"><b>Cannot pay in full: short by '+sf+' Gold.</b> ';

    }
    h+='</div>';});
  h+='</div>';
  const err=st===0?checkApply():[];
  if(err.length){h+='<div class="panel" style="border-color:var(--bad)">'+err.map(e=>'<div class="msg">'+esc(e)+'</div>').join('')+'</div>';blocked=true}

function applyTo(hold,i){
  const p=S.players[i],o=ord(i),h={...hold},built=[],errs=[];
  const get=(t)=>o.acts.map((a,k)=>[a,S.results[i][k]]).filter(([a])=>a.type===t);
  const chk=(step)=>RAWS.concat(MATS).forEach(k=>{if(h[k]<0)errs.push(HOUSES[p.house].ch+' would hold '+h[k]+' '+k+' after '+step+'.')});
  get('bid').forEach(([a,r])=>{if(r.won){GOODS[a.target].c.forEach(c=>h[c]--);built.push({good:a.target,year:S.year,value:Number(r.v)||0})}});chk('contracts');
  get('process').forEach(([a])=>{RECIPE[a.target].forEach(x=>h[x]-=a.n);h[a.target]+=a.n});chk('Process');
  get('sell').forEach(([a])=>h[a.target]-=a.n);chk('Trade Sell');
  get('buy').forEach(([a,r])=>h[a.target]+=r.q);
  get('raw').forEach(([a,r])=>h[a.target]+=r.q);
  return{h,built,errs};
}
function checkApply(){
  let e=[];const won={};
  alive().forEach(i=>{e=e.concat(applyTo(S.players[i].hold,i).errs);
    ord(i).acts.forEach((a,k)=>{const r=S.results[i]&&S.results[i][k];if(a.type==='bid'&&r&&r.won){(won[a.target]=won[a.target]||[]).push(HOUSES[S.players[i].house].ch)}});});
  Object.keys(won).forEach(g=>{if(won[g].length>copies(g))e.push(g+' has '+copies(g)+' cop'+(copies(g)===1?'y':'ies')+' on the table, but '+won[g].length+' Houses are marked as winners ('+won[g].join(', ')+').')});
  return e;
}
function recordsView(){
  const tabs=[['years','Years'],['built','Built works'],['export','Export']];
  let h='<div class="tabs">'+tabs.map(t=>'<button class="sm'+(UI.tab===t[0]?' on':'')+'" data-a="tab" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
  if(UI.tab==='built'){
    const rows=S.players.map((p,i)=>({p,i,tot:p.built.reduce((s,b)=>s+b.value,0)})).sort((a,b)=>b.tot-a.tot);
    h+='<div class="panel"><h3>Contract totals</h3><div class="scroll"><table><tr><th>House</th><th>Works</th><th>Total value</th></tr>'+rows.map(r=>'<tr><td>'+esc(HOUSES[r.p.house].ch)+'<div class="small mute">'+esc(r.p.name)+'</div></td><td>'+r.p.built.length+'</td><td>'+r.tot+'</td></tr>').join('')+'</table></div>'+
      '<div class="row" style="margin-top:10px"><button class="sm" data-a="fixtoggle">'+(UI.fix?'Done fixing':'Master: fix an entry')+'</button></div></div>';
    h+='<div class="cols">';
    S.players.forEach((p,i)=>{h+='<div class="panel">'+seatHead(p)+
      (p.built.length?'<div class="grid" style="margin-top:10px">'+p.built.map((b,j)=>'<div class="tile">'+img(b.good)+'<b>'+b.good+'</b><span>'+yl(b.year)+' &middot; value <b>'+b.value+'</b></span>'+(UI.fix?'<input type="number" min="0" data-c="bv" data-i="'+i+'" data-j="'+j+'" value="'+b.value+'" aria-label="Value"><button class="sm bad" data-a="rmbuilt" data-i="'+i+'" data-j="'+j+'">Remove</button>':'')+'</div>').join('')+'</div>':'<div class="mute small" style="margin-top:8px">Nothing built yet.</div>')+'</div>';});
    h+='</div>';
  }else if(UI.tab==='export'){
    h+='<div class="panel"><h3>Game record</h3><p class="small mute">Copy this text to keep the record. It does not include secret stock counts.</p><textarea id="ex" readonly>'+esc(exportText())+'</textarea><div class="row" style="margin-top:8px"><button class="pri" data-a="copy">Copy text</button></div>'+(UI.msg?'<p class="ok">'+esc(UI.msg)+'</p>':'')+'</div>';
  }else{
    if(!S.log.length)h+='<div class="panel mute">No Year has been closed yet.</div>';
    S.log.slice().reverse().forEach(y=>{h+=yearBlock(y,true)});
  }
  return h+'<div class="row" style="margin-top:14px"><button data-a="view" data-v="hub">Back to the table</button></div>';
}
function lineFor(a,r){
  if(a.type==='bid')return 'Bid '+a.n+' on '+a.target+': '+(r&&r.won?'WON, value '+r.v:'lost');
  const t={process:'Process',sell:'Trade Sell',buy:'Trade Buy',raw:'Raw Buy'}[a.type];
  return t+' '+a.n+' '+a.target+((a.type==='buy'||a.type==='raw')&&r&&r.q!==a.n?' (received '+r.q+')':'');
}
function exportText(){
  let t='PROSPERITAS ARCANA RECORD\n';
  S.players.forEach(p=>{t+='\n'+HOUSES[p.house].ch+' of House '+p.house+' ('+p.name+')'+(p.out?' ELIMINATED':'')+'\n  Built: '+(p.built.map(b=>b.good+' Y'+b.year+' value '+b.value).join('; ')||'none')+'\n  Total contract value: '+p.built.reduce((s,b)=>s+b.value,0)+'\n';});
  S.log.forEach(y=>{t+='\n'+yl(y.year).toUpperCase()+' ['+(y.mover||'no Mover')+'] market: '+mkLabel(y.market)+'\n';y.rows.forEach(r=>{t+='  '+HOUSES[r.house].ch+':\n'+r.lines.map(l=>'    - '+l).join('\n')+'\n'})});
  return t;
}
function masterView(){
  let h='<div class="panel"><h2>Master controls</h2><p class="small mute">Fix mistakes here between player turns: change anyone\'s stock, reopen a locked order, or undo the last Year close.</p></div>';
  h+='<div class="panel"><h3>Players</h3>';
  S.players.forEach((p,i)=>{h+='<div style="margin-top:10px">'+seatHead(p,(p.out?'<span class="badge err">Out</span>':'')+(S.step==='plan'&&ord(i).locked?'<span class="badge lock">Locked</span>':''))+
    '<div class="row" style="margin-top:6px"><span class="chip">Gold <b>'+p.gold+'</b></span>'+[-5,-1,1,5].map(d=>'<button class="sm" data-a="gold" data-i="'+i+'" data-d="'+d+'">'+(d>0?'+':'\u2212')+Math.abs(d)+'</button>').join('')+(p.debt?'<span class="badge err">Debt '+p.debt+'</span><button class="sm" data-a="cleardebt" data-i="'+i+'">Clear Debt</button>':'')+'</div><div class="row" style="margin-top:6px"><button class="sm" data-a="mstock" data-i="'+i+'">Edit stock</button>'+
    (S.step==='plan'&&ord(i).locked?'<button class="sm" data-a="reopen" data-i="'+i+'">Reopen order</button>':'')+
    '<button class="sm" data-a="toggleout" data-i="'+i+'">'+(p.out?'Reinstate':'Eliminate')+'</button></div></div>';});
  h+='</div><div class="panel"><h3>Game</h3><div class="row" style="margin-top:8px">'+
   '<button data-a="view" data-v="summary" '+(S.log.length?'':'disabled')+'>Latest Year summary</button><button data-a="undo" '+(S.undo?'':'disabled')+'>Undo last Year close</button>'+
   '<button class="bad" data-a="reset">'+(UI.confirm==='reset'?'Tap again to erase everything':'Start a new game')+'</button></div></div>';
  h+='<div class="panel"><h3>Backup</h3><p class="small mute" style="margin:4px 0 8px">The game is saved on this device. Copy a backup to keep it safe or move it to another device, and paste it below to restore.</p><div class="row"><button data-a="backup">Copy backup</button></div>'+(UI.msg?'<p class="ok">'+esc(UI.msg)+'</p>':'')+'<textarea id="bk" placeholder="Paste a backup here to restore" style="margin-top:8px;min-height:90px"></textarea><div class="row" style="margin-top:8px"><button data-a="restore" class="bad">Restore from backup</button></div></div>';
  return h+'<div class="row" style="margin-top:14px"><button class="pri" data-a="view" data-v="hub">Back to the table</button></div>';
}
function render(){
  const app=document.getElementById('app');
  let h=header();
  if(!S||S.phase!=='play')h+=setupView();
  else if(S.seat){const v=UI.view;h+=v==='review'?reviewView():v==='recipes'?recipesView():v==='sent'?sentView():sheetView()}
  else{const v=UI.view;
    h+=v==='hub'?hubView():v==='pass'?passView():v==='sheet'?sheetView():v==='summary'?summaryView():v==='review'?reviewView():v==='market'?marketView():v==='stock'?stockView():v==='recipes'?recipesView():v==='records'?recordsView():v==='master'?masterView():hubView();}
  app.innerHTML=h;
  const key=(S?S.year+S.step:'')+UI.view+UI.pid+UI.tab;
  if(key!==render.last){window.scrollTo(0,0);render.last=key}
}

/* ---------- events ---------- */
const act={
 join:()=>{const e=document.getElementById('joincode');UI.msg=joinSeat(e?e.value:'')},
 setdev:d=>{const p=S.players[+d.i];p.dev=p.dev==='own'?'shared':'own';UI.imp=null;save()},
 sharelink:d=>{const u=seatLink(+d.i),p=S.players[+d.i];UI.imp=null;if(navigator.share){navigator.share({title:'Prosperitas Arcana',text:p.name+', your order sheet for '+yl(S.year)+':',url:u}).catch(()=>{})}else{try{navigator.clipboard.writeText(u)}catch(e){}UI.imp={i:+d.i,ok:true,msg:'Link copied. Send it to '+p.name+'.'}}},
 copylink:d=>{const u=seatLink(+d.i);const ok=()=>{UI.imp={i:+d.i,ok:true,msg:'Link copied. Send it to '+S.players[+d.i].name+'.'};render()};try{navigator.clipboard.writeText(u).then(ok,()=>{UI.imp={i:+d.i,msg:'Could not copy.'};render()})}catch(e){UI.imp={i:+d.i,msg:'Could not copy.'}}},
 importorder:d=>{const i=+d.i,e=document.getElementById('imp'+i);let r;
  try{const o=dec(codeOf(e?e.value:''));
   if(!o||!o.g||!Array.isArray(o.a))throw 'That is not a valid order code.';
   if(o.g!==S.gid)throw 'This code is from a different game.';
   if(o.y!==S.year)throw 'This order is for Year '+o.y+', not this Year.';
   if(o.i!==i)throw 'This code belongs to a different seat.';
   const okT={bid:GOODS,process:RECIPE,sell:RECIPE,buy:RECIPE,raw:RC};
   const acts=o.a.slice(0,12).map(a=>({type:String(a.type),target:String(a.target||''),n:Math.floor(+a.n||0)}));
   if(acts.some(a=>!okT[a.type]||!Object.prototype.hasOwnProperty.call(okT[a.type],a.target)))throw 'The order contains something the game does not recognise.';
   const od=ord(i),prev=od.acts;od.acts=acts;
   if(acts.length>6||validate(i).some(Boolean)){od.acts=prev;throw 'The order was not accepted: it breaks a rule against the Master\'s stock record. Ask the player to check their stock with you and resend.'}
   od.locked=true;r={i,ok:true,msg:'Order received and locked.'}}
  catch(x){r={i,msg:typeof x==='string'?x:'That is not a valid order code.'}}
  UI.imp=r;save()},
 copycode:()=>{const e=document.getElementById('oc');const done=()=>{UI.msg='Copied.';render()};try{navigator.clipboard.writeText(e.value).then(done,()=>{e.select();UI.msg='Select and copy the code above.';render()})}catch(x){e.select();UI.msg='Select and copy the code above.'}},
 sharecode:()=>{const e=document.getElementById('oc');if(navigator.share){navigator.share({title:'Prosperitas Arcana order',text:e.value}).catch(()=>{})}else act.copycode()},
 editagain:()=>{ord(0).locked=false;UI.view='sheet';save()},
 leaveseat:()=>{if(UI.confirm==='leave'){try{localStorage.removeItem(KEY2)}catch(e){}S=load();UI={view:'hub',tab:'years',msg:'',confirm:'',warn:'',fix:false}}else UI.confirm='leave'},
 view:d=>{UI.view=d.v;UI.confirm='';UI.msg='';UI.warn='';UI.fix=false;if(d.v!=='stock')UI.back=null;if(d.v!=='recipes')UI.rback=null;},
 recipes:()=>{UI.rback=UI.view==='recipes'?UI.rback:UI.view;UI.view='recipes'},
 deal:()=>{readNames();UI.houses=shuffle(Object.keys(HOUSES)).slice(0,UI.n||4);},
 start:()=>{readNames();const n=UI.n||4;const names=Array.from({length:n},(_,i)=>(UI.names[i]||'').trim()||'Player '+(i+1));S=newGame(names,UI.houses);UI.view='hub';save();},
 pass:d=>{UI.pid=+d.i;UI.view='pass'},
 open:()=>{UI.view='sheet';UI.warn=''},
 add:d=>{const o=ord(UI.pid);o.acts.push({type:d.t,target:'',n:1});save()},
 review:()=>{UI.view='review'},
 unlock:()=>{},
 pick:d=>{ord(UI.pid).acts[+d.k].target=d.v;save()},
 unpick:d=>{ord(UI.pid).acts[+d.k].target='';save()},
 del:d=>{ord(UI.pid).acts.splice(+d.k,1);UI.warn='';save()},
 lock:()=>{const o=ord(UI.pid);if(o.acts.length>6||validate(UI.pid).some(Boolean)){UI.view='review';return}o.locked=true;UI.view=S.seat?'sent':'hub';if(!S.seat)UI.pid=null;UI.warn='';save()},
 reveal:()=>{S.step='reveal';UI.confirm='';save()},
 revealforce:()=>{if(UI.confirm==='reveal'){S.step='reveal';UI.confirm=''}else UI.confirm='reveal';save()},
 toresults:()=>{ensureResults();S.step='results';S.stage=0;S.prices={sell:{},buy:{},raw:{}};save()},
 stage:d=>{S.stage=Math.max(0,Math.min(5,S.stage+Number(d.d)));window.scrollTo(0,0);save()},
 debt:d=>{const p=S.players[+d.i];p.gold+=Number(d.v);p.debt=Number(d.v);save()},
 gold:d=>{S.players[+d.i].gold+=Number(d.d);save()},
 cleardebt:d=>{S.players[+d.i].debt=0;save()},
 mk:d=>{const need=alive().length+3;if(copies(d.g)<3&&S.market.length<need)S.market.push(d.g);save()},
 mkrm:d=>{const k=S.market.lastIndexOf(d.g);if(k>=0)S.market.splice(k,1);save()},
 adj:d=>{const p=S.players[+d.i];p.hold[d.k]=Math.max(0,p.hold[d.k]+Number(d.d));save()},
 stockme:()=>{UI.back='sheet';UI.view='stock'},
 mstock:d=>{UI.pid=+d.i;UI.back='master';UI.view='stock'},
 reopen:d=>{ord(+d.i).locked=false;save()},
 toggleout:d=>{S.players[+d.i].out=!S.players[+d.i].out;save()},
 tab:d=>{UI.tab=d.t;UI.msg=''},
 fixtoggle:()=>{UI.fix=!UI.fix},
 backup:()=>{const t=JSON.stringify(S);const ok=()=>{UI.msg='Backup copied.';render()};try{navigator.clipboard.writeText(t).then(ok,()=>{UI.msg='Could not copy. Long-press the box below and copy.';const e=document.getElementById('bk');if(e){e.value=t;e.select()}render()})}catch(e){UI.msg='Could not copy.'}},
 restore:()=>{const e=document.getElementById('bk');try{const g=JSON.parse(e.value);if(!g||!g.players||!g.year)throw 0;S=g;S.players.forEach(p=>{if(p.gold==null)p.gold=50;if(p.debt==null)p.debt=0});UI.view='hub';UI.msg='';save()}catch(x){UI.msg='That is not a valid backup.'}},
 rmbuilt:d=>{S.players[+d.i].built.splice(+d.j,1);save()},
 copy:()=>{const t=exportText();const done=()=>{UI.msg='Copied.';render()};
   try{navigator.clipboard.writeText(t).then(done,()=>{const e=document.getElementById('ex');e.select();UI.msg='Select and copy the text above.';render()})}catch(e){UI.msg='Select and copy the text above.'}},
 apply:()=>{
   if(checkApply().length)return;
   const snap=JSON.parse(JSON.stringify(S));snap.undo=null;
   const rows=[];const FL=flows();
   S.players.forEach((p,i)=>{
     if(p.out)return;
     const o=ord(i),r=applyTo(p.hold,i);
     const delta=Object.keys(r.h).filter(k=>r.h[k]!==p.hold[k]).map(k=>[k,r.h[k]-p.hold[k]]);
     const gold=[FL[i].start,FL[i].end];rows.push({gold,name:p.name,house:p.house,lines:o.acts.map((a,k)=>lineFor(a,S.results[i][k])),delta,won:r.built});
     p.hold=r.h;p.built=p.built.concat(r.built);p.gold=FL[i].end;
   });
   S.log.push({year:S.year,mover:S.mover,market:S.market.slice(),rows});
   S.removed=[];rows.forEach(r=>(r.won||[]).forEach(w=>{const k=S.market.indexOf(w.good);if(k>=0){S.market.splice(k,1);S.removed.push(w.good)}}));
   S.undo=snap;S.lastPrices=JSON.parse(JSON.stringify(S.prices));S.prices={sell:{},buy:{},raw:{}};S.stage=0;
   if(S.year>=16){S.step='end'}else{S.year++;S.step='plan';S.orders={};S.results={};UI.warn='';if((S.year-1)%4===0)S.mover=null;}
   UI.view='summary';UI.pid=null;save();
 },
 undo:()=>{if(S.undo){S=S.undo;S.undo=null;UI.view='hub';save()}},
 reset:()=>{if(UI.confirm==='reset'){try{localStorage.removeItem(KEY)}catch(e){}S=null;UI={view:'hub',tab:'years',msg:'',confirm:'',warn:'',fix:false}}else UI.confirm='reset'}
};
function readNames(){UI.names=UI.names||[];document.querySelectorAll('[data-c=pname]').forEach(e=>UI.names[+e.dataset.i]=e.value)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=act[b.dataset.a];if(f){f(b.dataset);render()}});
document.addEventListener('change',e=>{
  const t=e.target,c=t.dataset.c;if(!c)return;
  if(c==='np'){readNames();UI.n=+t.value;UI.houses=null}
  else if(c==='pname'){UI.names=UI.names||[];UI.names[+t.dataset.i]=t.value;return}
  else if(c==='mover'){S.mover=t.value||null;save()}
  else if(c==='n'){const a=ord(UI.pid).acts[+t.dataset.k];a.n=Math.max(0,Math.floor(Number(t.value)||0));save()}
  else if(c==='won'){const r=S.results[+t.dataset.i][+t.dataset.k];r.won=t.checked;save()}
  else if(c==='wv'){const r=S.results[+t.dataset.i][+t.dataset.k];r.v=Math.max(0,Math.floor(Number(t.value)||0));save()}
  else if(c==='rq'){const a=ord(+t.dataset.i).acts[+t.dataset.k];const r=S.results[+t.dataset.i][+t.dataset.k];r.q=Math.min(a.n,Math.max(0,Math.floor(Number(t.value)||0)));save()}
  else if(c==='px'){const v=Math.max(0,Math.floor(Number(t.value)||0));S.prices[t.dataset.g][t.dataset.m]=v||undefined;save()}
  else if(c==='bv'){S.players[+t.dataset.i].built[+t.dataset.j].value=Math.max(0,Math.floor(Number(t.value)||0));save()}
  render();
});
(function boot(){
  const m=(location.hash||'').match(/seat=([A-Za-z0-9_\-]+)/);
  if(m){const e=joinSeat(m[1]);try{history.replaceState(null,'',location.pathname+location.search)}catch(x){}if(e){S=load();UI.msg=e}else return;}
  else{S=load();if(!S)S=loadSeat();if(S&&S.seat)UI={view:ord(0).locked?'sent':'sheet',pid:0,tab:'years',msg:'',confirm:'',warn:'',fix:false};}
})();render();

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
let _wl=null;async function keepAwake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible'){_wl=await navigator.wakeLock.request('screen')}}catch(e){}}
document.addEventListener('visibilitychange',keepAwake);document.addEventListener('click',()=>{if(!_wl)keepAwake()},{once:true});

</script>
